<!DOCTYPE html>
<html>
    <head>
        <title>
            Qr Code generator
        </title>
        <style>
            body{
                background-color: #262a2a;
            }
            *{
                margin: 0;
                padding: 0;
                font-family: 'Poppins' ,sans-serif;
                box-sizing: border-box;
            }
            .container{
                width :400px;
                padding: 25px 35px;
                position: absolute;
                top: 50%;
                left:50%;
                transform: translate(-50%,-50%);
                background-color: #fff;
                border-radius: 10px;

            }
            .container p{
                font-weight: 600;
                font-size: 15px;
                margin-bottom: 8px;
            }
            .container input{
                width: 100%;
                height: 50px;
                border: 1px solid #494;
                outline: 0;
                padding: 10px;
                margin: 10px 0 20px;
                border-radius: 5px;
            }
            .container button{
                width: 100%;
                height: 50px;
                background-color:#494eea ;
                color: #fff;
                border: 0;
                outline: 0;
                border-radius: 5px;
                box-shadow:  0 10px 10px rgba(0,0,0,0.1);
                             }
            #imgbox{
                width: 200px;
                border-radius: 5px;
                max-height: 0;
                overflow: hidden;

            }
            #imgbox img{
                width :100%;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <div class="container">
        <p> Enetr Your text or URL</p>
        <input type="text" placeholder="text" id ="qrText">
        <div id ="imgbox">
            <img src="" alt="imabe not generated yet" id ="imgscr">
        </div>
        <button onclick="Qrcodegenerator()"> Generate QR Code</button>
        </div>
        <script>
            let imgbox = document.getElementById("imgbox");
            let imgscr =document.getElementById("imgscr");
            let qrText =document.getElementById("qrText"); // it will return value given in input field
            function Qrcodegenerator(){
                if(qrText.value.length > 0){
                imgscr.src ="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(qrText.value);
                imgbox.style.maxHeight="300px" //show the qr coed
                }
                else{
                    imgbox.style.maxHeight ="0"; // hide if no inout
                }
            }
        </script>
    </body>
</html>
